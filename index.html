<script>
// PARAMETERS (Global Variables)
let data = [];
let currentScene = 1;
const margin = {top: 50, right: 50, bottom: 50, left: 60};
const width = 800 - margin.left - margin.right;
const height = 450 - margin.top - margin.bottom;

// Load external CSV file asynchronously from repository root folder
d3.csv("data.csv").then(function(loadedData) {
    // Format text string metrics to clean floating numbers
    data = loadedData.map(d => ({
        id: +d.id,
        gender: d.gender,
        occupation_type: d.occupation_type,
        avg_work_hours_per_day: +d.avg_work_hours_per_day,
        avg_sleep_hours_per_day: +d.avg_sleep_hours_per_day,
        age_at_death: +d.age_at_death
    }));

    // Setup drop-down options dynamically based on CSV content
    const occupations = ["All", ...new Set(data.map(d => d.occupation_type))];
    d3.select("#occupationFilter")
      .selectAll("option")
      .data(occupations)
      .enter()
      .append("option")
      .text(d => d);

    // Bootstrap first narrative scene initial render
    renderScene1();
}).catch(function(error) {
    d3.select("#scene-description")
      .text("Error loading data.csv file. Make sure it is named exactly data.csv in your root repo folder.")
      .style("color", "red");
    console.error("CSV Loading Error: ", error);
});

function drawCanvas() {
    d3.select("#chart").html("");
    
    const svg = d3.select("#chart")
        .append("svg")
        .attr("width", width + margin.left + margin.right)
        .attr("height", height + margin.top + margin.bottom)
        .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    // Dynamic linear domain configuration matching true CSV boundaries
    const yExtent = d3.extent(data, d => d.age_at_death);
    const yScale = d3.scaleLinear()
        .domain([yExtent[0] - 5, yExtent[1] + 5])
        .range([height, 0]);

    svg.append("g").call(d3.axisLeft(yScale));
    svg.append("text")
       .attr("transform", "rotate(-90)")
       .attr("y", -45)
       .attr("x", -height/2)
       .style("text-anchor", "middle")
       .text("Age at Death");

    return { svg, yScale };
}

function renderScene1() {
    const { svg, yScale } = drawCanvas();
    d3.select("#scene-description").text("Scene 1: Overworking heavily strains your longevity. Notice the downward trajectory as average daily work hours scale past 9 hours.");
    d3.select("#explore-controls").style("display", "none");

    const xExtent = d3.extent(data, d => d.avg_work_hours_per_day);
    const xScale = d3.scaleLinear().domain([xExtent[0] - 1, xExtent[1] + 1]).range([0, width]);
    svg.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(xScale));
    svg.append("text").attr("x", width/2).attr("y", height + 40).style("text-anchor", "middle").text("Avg Work Hours / Day");

    // Render Points with graceful entry transitions
    svg.selectAll("circle")
       .data(data)
       .enter()
       .append("circle")
       .attr("cx", d => xScale(d.avg_work_hours_per_day))
       .attr("cy", d => yScale(d.age_at_death))
       .attr("r", 0) 
       .attr("fill", "#e06666")
       .transition()
       .duration(800)
       .attr("r", 7);

    // Dynamic Annotation anchoring automatically near max workload rows
    const maxWork = d3.max(data, d => d.avg_work_hours_per_day);
    const extremePoint = data.find(d => d.avg_work_hours_per_day === maxWork);
    
    if (extremePoint) {
        const annotations = [{
            note: { title: "The Overwork Cliff", label: "Consistently elevated occupational shifts map directly to decreased lifespan values." },
            x: xScale(extremePoint.avg_work_hours_per_day), y: yScale(extremePoint.age_at_death), dx: -40, dy: -30
        }];
        const makeAnnotations = d3.annotation().annotations(annotations);
        svg.append("g").call(makeAnnotations);
    }
}

function renderScene2() {
    const { svg, yScale } = drawCanvas();
    d3.select("#scene-description").text("Scene 2: Conversely, systemic biological rest repairs the body. Individuals hitting the 7 to 8-hour sleep sweet spot sustain optimized longevity.");
    d3.select("#explore-controls").style("display", "none");

    const xExtent = d3.extent(data, d => d.avg_sleep_hours_per_day);
    const xScale = d3.scaleLinear().domain([xExtent[0] - 1, xExtent[1] + 1]).range([0, width]);
    svg.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(xScale));
    svg.append("text").attr("x", width/2).attr("y", height + 40).style("text-anchor", "middle").text("Avg Sleep Hours / Day");

    svg.selectAll("circle")
       .data(data)
       .enter()
       .append("circle")
       .attr("cx", d => xScale(d.avg_sleep_hours_per_day))
       .attr("cy", d => yScale(d.age_at_death))
       .attr("r", 0)
       .attr("fill", "#6fa8dc")
       .transition()
       .duration(800)
       .attr("r", 7);

    const maxSleep = d3.max(data, d => d.avg_sleep_hours_per_day);
    const optimalPoint = data.find(d => d.avg_sleep_hours_per_day === maxSleep);

    if (optimalPoint) {
        const annotations = [{
            note: { title: "The Recovery Zone", label: "Adequate recovery cycles consistently align with top data thresholds." },
            x: xScale(optimalPoint.avg_sleep_hours_per_day), y: yScale(optimalPoint.age_at_death), dx: -50, dy: 30
        }];
        const makeAnnotations = d3.annotation().annotations(annotations);
        svg.append("g").call(makeAnnotations);
    }
}

function renderScene3(filteredData = data) {
    const { svg, yScale } = drawCanvas();
    d3.select("#scene-description").text("Scene 3: Free Exploration. Use the dropdown tool to filter by occupation type. Hover over individual data points to reveal details.");
    d3.select("#explore-controls").style("display", "block");

    const xExtent = d3.extent(data, d => d.avg_work_hours_per_day);
    const xScale = d3.scaleLinear().domain([xExtent[0] - 1, xExtent[1] + 1]).range([0, width]);
    svg.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(xScale));
    svg.append("text").attr("x", width/2).attr("y", height + 40).style("text-anchor", "middle").text("Avg Work Hours / Day");

    const tooltip = d3.select("#tooltip");

    svg.selectAll("circle")
       .data(filteredData)
       .enter()
       .append("circle")
       .attr("cx", d => xScale(d.avg_work_hours_per_day))
       .attr("cy", d => yScale(d.age_at_death))
       .attr("r", 0)
       .attr("fill", d => d.gender === "Male" ? "#3d85c6" : "#c27ba0")
       .style("cursor", "pointer")
       .on("mouseover", function(event, d) {
           tooltip.style("opacity", 1)
                  .html(`<strong>ID:</strong> ${d.id}<br/>
                         <strong>Gender:</strong> ${d.gender}<br/>
                         <strong>Job:</strong> ${d.occupation_type}<br/>
                         <strong>Work Hours:</strong> ${d.avg_work_hours_per_day}h<br/>
                         <strong>Sleep Hours:</strong> ${d.avg_sleep_hours_per_day}h<br/>
                         <strong>Age at Death:</strong> ${d.age_at_death}`)
                  .style("left", (event.pageX + 12) + "px")
                  .style("top", (event.pageY - 28) + "px");
       })
       .on("mouseout", () => tooltip.style("opacity", 0))
       .transition()
       .duration(600)
       .attr("r", 8);
}

function changeScene(sceneNum) {
    currentScene = sceneNum;
    d3.selectAll(".nav-btn").each(function() {
        this.classList.remove("active");
    });
    d3.select(`#btn${sceneNum}`).node().classList.add("active");
    
    if(sceneNum === 1) renderScene1();
    else if(sceneNum === 2) renderScene2();
    else if(sceneNum === 3) renderScene3();
}

function updateExploration() {
    const selectedJob = d3.select("#occupationFilter").property("value");
    const filtered = selectedJob === "All" ? data : data.filter(d => d.occupation_type === selectedJob);
    renderScene3(filtered);
}
</script>
